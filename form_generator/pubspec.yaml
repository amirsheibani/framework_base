name: form_generator
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  framework_base:
    path: ../

  hugeicons: ^1.1.5
  flutter_riverpod: ^2.4.0
  cupertino_icons: ^1.0.8
  go_router: ^17.0.1
  dio: ^5.9.0
  retrofit: ^4.9.2
  get_it: ^8.2.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.12.0
  sentry_flutter: ^8.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.0
  retrofit_generator: ^10.2.1
  injectable_generator: ^2.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/json/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto.woff2
    - family: IRANSansXFaNum
      fonts:
        - asset: assets/fonts/iransansx/IRANSansXFaNum-Black.ttf
          weight: 900
        - asset: assets/fonts/iransansx/IRANSansXFaNum-ExtraBlack.ttf
          weight: 800
        - asset: assets/fonts/iransansx/IRANSansXFaNum-Bold.ttf
          weight: 700
        - asset: assets/fonts/iransansx/IRANSansXFaNum-Bold.ttf
          weight: 600
        - asset: assets/fonts/iransansx/IRANSansXFaNum-Medium.ttf
          weight: 500
        - asset: assets/fonts/iransansx/IRANSansXFaNum-Regular.ttf
          weight: 400
        - asset: assets/fonts/iransansx/IRANSansXFaNum-Light.ttf
          weight: 300
        - asset: assets/fonts/iransansx/IRANSansXFaNum-UltraLight.ttf
          weight: 200
        - asset: assets/fonts/iransansx/IRANSansXFaNum-Thin.ttf
          weight: 100
    # To add assets to your application, add an assets section, like this:

    # An image asset can refer to one or more resolution-specific "variants", see
    # https://flutter.dev/to/resolution-aware-images

    # For details regarding adding assets from package dependencies, see
    # https://flutter.dev/to/asset-from-package

flutter_intl:
  enabled: true
